<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leagues &amp; standings · Matchday</title>
  <meta name="description" content="Browse Europe's top five football leagues, next fixtures, latest results and league tables.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body data-root="../" data-page="Leagues">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap page">
      <div class="page-head">
        <div>
          <span class="eyebrow">Competitions</span>
          <h1>Leagues &amp; sports</h1>
          <p class="page-sub">Browse by sport, then dig into a league. Every competition page carries its next fixtures, latest results, full table and scoring chart.</p>
        </div>
        <div class="chip-row" role="group" aria-label="Filter by sport">
          <button class="chip is-active" type="button" data-sport="football">Football</button>
          <button class="chip" type="button" disabled title="Cricket support is planned for a later phase">Cricket · soon</button>
          <button class="chip" type="button" disabled title="Basketball support is planned for a later phase">Basketball · soon</button>
        </div>
      </div>

      <div class="league-layout">
        <aside class="league-side panel">
          <div class="panel-head">
            <h3>Leagues</h3>
            <span class="panel-sub" id="league-count"></span>
          </div>
          <ul class="league-list" id="league-list"></ul>
          <p class="side-note">Football only for this phase. The sport and league filters are ready for more sports later.</p>
        </aside>

        <section id="league-detail" aria-live="polite"></section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../data/matches-data.js"></script>
  <script src="../data/teams-data.js"></script>
  <script src="../data/players-data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="leagues.js"></script>
</body>
</html>
