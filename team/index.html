<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team page · Matchday</title>
  <meta name="description" content="Club profile, next fixtures, recent results, form and full squad with player statistics.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body data-root="../" data-page="Team">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap page">
      <a class="back-link" href="../leagues/index.html">← Back to leagues</a>
      <div id="team-root"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../data/matches-data.js"></script>
  <script src="../data/teams-data.js"></script>
  <script src="../data/players-data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="team.js"></script>
</body>
</html>
