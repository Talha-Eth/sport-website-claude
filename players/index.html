<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Players &amp; stats · Matchday</title>
  <meta name="description" content="Search, filter and sort 560 football players by league, club and position, then compare two players side by side.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body data-root="../" data-page="Players">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap page players-page">
      <div class="page-head">
        <div>
          <span class="eyebrow">Player database</span>
          <h1>Players &amp; stats</h1>
          <p class="page-sub">Search and filter every player, sort the table by any stat and tick two names to compare them side by side. Season totals update from the match line-ups.</p>
        </div>
        <a class="btn btn-outline" href="../compare/index.html">Compare players</a>
      </div>

      <div class="filter-bar players-filter" role="search" aria-label="Filter players">
        <div class="field">
          <label for="player-search">Search players</label>
          <input class="input" id="player-search" type="search" placeholder="Name or club" autocomplete="off">
        </div>
        <div class="field">
          <label for="player-league">League</label>
          <select class="select" id="player-league"></select>
        </div>
        <div class="field">
          <label for="player-team">Team</label>
          <select class="select" id="player-team"></select>
        </div>
        <div class="field">
          <label for="player-position">Position</label>
          <select class="select" id="player-position">
            <option value="all">All positions</option>
            <option value="Goalkeeper">Goalkeeper</option>
            <option value="Defender">Defender</option>
            <option value="Midfielder">Midfielder</option>
            <option value="Forward">Forward</option>
          </select>
        </div>
      </div>

      <div class="players-toolbar">
        <p class="result-count" id="players-count"></p>
        <button class="filter-clear" type="button" id="players-reset">Reset filters</button>
      </div>

      <div id="players-table"></div>

      <div class="compare-bar" id="compare-bar" hidden>
        <div class="compare-selected" id="compare-selected"></div>
        <div class="compare-actions">
          <button class="btn btn-sm btn-outline" type="button" id="compare-clear">Clear</button>
          <button class="btn btn-gold" type="button" id="compare-go" disabled>Compare players</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../data/matches-data.js"></script>
  <script src="../data/teams-data.js"></script>
  <script src="../data/players-data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="players.js"></script>
</body>
</html>
