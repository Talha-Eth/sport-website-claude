<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare players · Matchday</title>
  <meta name="description" content="Compare two football players side by side with bars that highlight the higher value in every stat.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body data-root="../" data-page="Compare">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap page">
      <a class="back-link" href="../players/index.html">← Back to players</a>
      <div class="page-head">
        <div>
          <span class="eyebrow">Head to head</span>
          <h1>Compare players</h1>
          <p class="page-sub">Pick two players from any club. Season totals are shown side by side, with the higher value in each row highlighted.</p>
        </div>
        <a class="btn btn-outline" href="../players/index.html">All players</a>
      </div>

      <div class="compare-selects">
        <div class="field">
          <label for="compare-a">Player one</label>
          <select class="select" id="compare-a"></select>
        </div>
        <button class="compare-swap icon-btn" id="compare-swap" type="button" aria-label="Swap players" style="color:var(--ink);border:1px solid var(--line);background:var(--card);">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <div class="field">
          <label for="compare-b">Player two</label>
          <select class="select" id="compare-b"></select>
        </div>
      </div>

      <div id="compare-root"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../data/matches-data.js"></script>
  <script src="../data/teams-data.js"></script>
  <script src="../data/players-data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="compare.js"></script>
</body>
</html>
